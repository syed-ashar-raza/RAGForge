services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ragforge
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ragforge:ragforge@postgres:5432/ragforge
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
